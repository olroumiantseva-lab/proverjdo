name: IndexNow

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  notify-yandex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Submit changed pages to Yandex IndexNow
        shell: bash
        run: |
          set -euo pipefail

          KEY="40e38bf0c1dba0c93cced46242f4b47d"
          HOST="proverjdo.ru"
          ENDPOINT="https://yandex.com/indexnow"

          urls=()

          if git rev-parse HEAD^ >/dev/null 2>&1; then
            while IFS= read -r file; do
              case "$file" in
                index.html)
                  urls+=("https://${HOST}/")
                  ;;
                */index.html)
                  dir="${file%/index.html}"
                  urls+=("https://${HOST}/${dir}/")
                  ;;
              esac
            done < <(git diff --name-only HEAD^ HEAD)
          fi

          # If sitemap.xml changed, submit only URLs whose sitemap lines changed.
          # Each sitemap URL is stored on one line, so a lastmod change adds that full line to git diff.
          if git rev-parse HEAD^ >/dev/null 2>&1 && git diff --name-only HEAD^ HEAD | grep -qx 'sitemap.xml'; then
            while IFS= read -r url; do
              [ -n "$url" ] && urls+=("$url")
            done < <(
              git diff --unified=0 HEAD^ HEAD -- sitemap.xml |
              grep '^+' |
              grep -v '^+++' |
              sed -n 's#.*<loc>\(https://proverjdo\.ru/[^<]*\)</loc>.*#\1#p'
            )
          fi

          # A manual run without changed HTML/sitemap does not need to submit stale URLs.
          if [ ${#urls[@]} -eq 0 ]; then
            echo "No changed public URLs to submit."
            exit 0
          fi

          # De-duplicate URLs.
          mapfile -t urls < <(printf '%s\n' "${urls[@]}" | awk '!seen[$0]++')

          # Give GitHub Pages a short window to publish the key/page changes.
          sleep 30

          failed=0
          for url in "${urls[@]}"; do
            echo "Submitting: $url"
            code=$(curl -sS -o /tmp/indexnow-response.txt -w '%{http_code}' \
              --get "$ENDPOINT" \
              --data-urlencode "url=$url" \
              --data-urlencode "key=$KEY" || true)
            echo "HTTP $code"
            cat /tmp/indexnow-response.txt || true
            echo

            # 200 = accepted; 202 = key accepted but still being verified.
            if [ "$code" != "200" ] && [ "$code" != "202" ]; then
              failed=1
            fi
          done

          exit "$failed"

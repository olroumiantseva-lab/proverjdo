name: Letter Draft Live Test
on:
  push:
    paths:
      - '.github/workflows/letter-draft-live-test.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Call production letter-draft-scan
        run: |
          cat > payload.json <<'JSON'
          {
            "scenario":"business",
            "tone":"neutral",
            "recipient":"поставщику товара",
            "situation":"Хотим закупить товар у поставщика, но перед заказом нужно уточнить его технические характеристики.",
            "goal":"Получить от поставщика полные технические характеристики товара, чтобы проверить, подходит ли он нам.",
            "facts":"Конкретного перечня характеристик пока нет. Договор ещё не заключён."
          }
          JSON
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H 'Content-Type: application/json' \
            -H 'Origin: https://proverjdo.ru' \
            --data @payload.json \
            'https://vhssshjcrirsuiijolwq.supabase.co/functions/v1/letter-draft-scan' \
            -o response.json
          cat response.json

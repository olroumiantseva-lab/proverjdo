<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Оплата принята — Проверь до</title><script src="../../assets/runtime-config.js"></script><script>(()=>{const p=new URLSearchParams(location.search);const inv=p.get('InvId');const site=p.get('Shp_site');if(site==='ded'){const u=new URL('https://srumyantsev.ru/tools/document/payment/success/');if(inv)u.searchParams.set('InvId',inv);location.replace(u.toString());return;}if(site!=='proverjdo'||!inv||!/^\d+$/.test(inv)){location.replace('/');return;}let saved={};try{saved=JSON.parse(sessionStorage.getItem('proverjdo.payment.v1')||'null')||{}}catch{}const fallbackProduct=saved?.product_id||'';const target=(productId)=>productId==='document_explain_once_290'?'/explain-result/?InvId='+encodeURIComponent(inv):productId==='letter_draft_390'?'/letter-result/?InvId='+encodeURIComponent(inv):'/result/?InvId='+encodeURIComponent(inv);const cfg=window.__SUPABASE_CONFIG__||{};const endpoint=(cfg.url||'').replace(/\/$/,'')+'/functions/v1/payment-status';fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json',...(cfg.publishableKey?{apikey:cfg.publishableKey}:{})},body:JSON.stringify({order_id:inv})}).then(async r=>r.ok?await r.json():{verified:false}).then(data=>{const productId=data?.product_id||fallbackProduct;if(data?.verified){try{sessionStorage.setItem('proverjdo.payment_success.pending',JSON.stringify({order_id:String(inv),product_id:productId||'',ts:Date.now()}));}catch{}}location.replace(target(productId));}).catch(()=>location.replace(target(fallbackProduct)));})();</script></head><body><p>Проверяем оплату и возвращаем вас в сервис…</p></body></html>
